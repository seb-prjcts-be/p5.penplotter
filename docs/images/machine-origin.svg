<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Machine origin in Seb's photographed setup</title>
  <desc id="desc">The machine viewed as in Seb's photograph: origin at the bottom left, positive X upwards along the 594 millimetre rail, positive Y to the right across 432 millimetres. The adjacent coordinate view displays the same origin at top left, X to the right and Y downwards.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial,sans-serif" fill="#111">
    <text x="24" y="28" font-size="16">Seb's setup, viewed as in the photo</text>
    <text x="328" y="28" font-size="16">The same bed in coordinates</text>
    <rect x="70" y="60" width="172.8" height="237.6" fill="#eee" stroke="#111"/>
    <rect x="72.4" y="60" width="168" height="237.6" fill="#fff" stroke="#777"/>
    <path d="M65 292.6 l10 10 m-10 0 l10 -10" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <path d="M50 280 V90 M50 90 l-5 9 m5 -9 l5 9 M90 322 H225 M225 322 l-9 -5 m9 5 l-9 5" fill="none" stroke="#111" stroke-width="2"/>
    <text x="22" y="180" font-size="13">+X ↑</text><text x="122" y="346" font-size="13">+Y →</text>
    <text x="76" y="284" font-size="12">start (0,0)</text>
    <text x="95" y="90" font-size="13">A2 paper</text>
    <rect x="330" y="125" width="237.6" height="172.8" fill="#eee" stroke="#111"/>
    <rect x="330" y="127.4" width="237.6" height="168" fill="#fff" stroke="#777"/>
    <path d="M325 120 l10 10 m-10 0 l10 -10" fill="none" stroke="#d32f2f" stroke-width="2.5"/>
    <path d="M348 103 H550 M550 103 l-9 -5 m9 5 l-9 5 M580 142 V280 M580 280 l-5 -9 m5 9 l5 -9" fill="none" stroke="#111" stroke-width="2"/>
    <text x="410" y="88" font-size="13">+X →</text><text x="566" y="322" font-size="13">+Y ↓</text>
    <text x="341" y="145" font-size="12">start (0,0)</text>
    <text x="410" y="190" font-size="13">A2 paper</text>
    <text x="24" y="379" font-size="13">One origin, two views. Moving the carriage does not reverse the motor directions.</text>
  </g>
</svg>
