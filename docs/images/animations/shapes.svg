<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shapes recorded for the pen</title>
  <desc id="desc">A coordinate diagram, not a view of the physical machine. The origin is at the diagram's top left; positive X follows the 594 mm rail and positive Y spans 432 mm. Paper and drawing are placed within those coordinates. The physical starting corner must match the driver's motor directions.</desc>
  <rect width="600" height="400" fill="#000"/>
  <g font-family="monospace" fill="#fff"><text x="18" y="26" font-size="17">p5.penplotter</text><text x="18" y="50" font-size="13">Shapes recorded for the pen</text></g>
  <rect x="18" y="85" width="225" height="235" fill="none" stroke="#00ffff" stroke-width="3"/>
  <text x="30" y="105" font-family="monospace" font-size="13" fill="#00ffff">p5.js canvas</text>
  <rect x="30" y="115" width="200" height="200" fill="#fff"/>
  <g transform="translate(30 115)"><path d="M30.00,30.00 L170.00,30.00 L170.00,170.00 L30.00,170.00 L30.00,30.00" fill="none" stroke="#ff00ff" stroke-width="1.2"/></g>
  <text x="257" y="218" fill="#00ffff" font-family="monospace" font-size="16">→</text>
  <text x="314" y="75" fill="#fff" font-family="monospace" font-size="12">BED COORDINATES</text>
  <rect x="302" y="100" width="267.3" height="194.4" fill="#fff" stroke="#00ffff" stroke-width="2"/>
  <rect x="302" y="102.7" width="267.3" height="189" fill="#eee" stroke="#777"/>
  <text x="467" y="119" font-family="monospace" font-size="11">A2 paper</text>
  <path d="M30.00,30.00 L170.00,30.00 L170.00,170.00 L30.00,170.00 L30.00,30.00" transform="translate(370.65 129.7) scale(.65)" fill="none" stroke="#ff00ff" stroke-width="1.5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;1;0;0" keyTimes="0;.2;.85;1" dur="8s" repeatCount="indefinite"/></path>
  <circle r="3.5" fill="#000" stroke="#00ffff" stroke-width="2"><animateMotion path="M302,100 L390.15,149.20 L481.15,149.20 L481.15,240.20 L390.15,240.20 L390.15,149.20 L302,100" dur="8s" repeatCount="indefinite"/></circle>
  <path d="M298 96 l8 8 m-8 0 l8 -8" fill="none" stroke="#ff3333" stroke-width="2"/>
  <g font-family="monospace" font-size="11" fill="#00ffff"><text x="290" y="91">(0,0)</text><text x="407" y="91">+X · 594 mm →</text><text x="574" y="176">+Y</text><text x="574" y="193">↓</text><text x="403" y="313">Y span: 432 mm</text></g>
  <g font-family="monospace" font-size="12" fill="#fff"><text x="18" y="348">Coordinate view. Match X and Y to the real machine.</text><text x="18" y="370">Start at its known origin. A different corner changes the job.</text></g>
</svg>
